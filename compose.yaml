services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8788:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
